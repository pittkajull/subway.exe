<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — page not found | subway.exe</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#08090a" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%favicon-dark.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #08090a;
        --bg-1: #0b0c0b;
        --fg: #eae9e9;
        --fg-2: #a8a9a2;
        --fg-3: #767871;
        --fg-4: #4e514a;
        --line: #232520;
        --line-2: #353830;
        --red: #f23c3f;
        --font: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas,
          'Liberation Mono', monospace;
        --pad: clamp(18px, 5vw, 44px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg-2);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.7;
        letter-spacing: 0.005em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
      }

      ::selection {
        background: var(--red);
        color: var(--bg);
      }

      :focus-visible {
        outline: 1px solid var(--red);
        outline-offset: 3px;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 760px;
        min-height: 100vh;
        margin-inline: auto;
        padding: 28px var(--pad) 36px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line-2);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--fg);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand img {
        width: 30px;
        height: auto;
      }

      .accent {
        color: var(--red);
      }

      .tag {
        flex: none;
        padding: 3px 7px;
        border: 1px solid var(--line-2);
        color: var(--fg-3);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .main {
        display: flex;
        flex: 1;
        align-items: center;
        padding-block: clamp(42px, 10vh, 96px);
      }

      .terminal {
        width: 100%;
        border: 1px solid var(--line-2);
        background: var(--bg-1);
      }

      .terminal__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--fg-4);
        font-size: 10px;
      }

      .terminal__bar span:last-child {
        color: var(--fg-3);
      }

      .terminal__body {
        padding: clamp(22px, 5vw, 40px);
      }

      .prompt {
        color: var(--fg-3);
        font-size: 11.5px;
      }

      .prompt__host {
        color: var(--fg-2);
      }

      .prompt__dollar {
        color: var(--red);
      }

      .error {
        margin-top: 8px;
        color: var(--red);
        font-size: 11.5px;
      }

      h1 {
        max-width: 10ch;
        margin: 28px 0 0;
        color: var(--fg);
        font-size: clamp(38px, 11vw, 76px);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.065em;
      }

      .copy {
        max-width: 52ch;
        margin: 18px 0 0;
        color: var(--fg-3);
        font-size: 12.5px;
        line-height: 1.85;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }

      .button {
        display: inline-block;
        padding: 8px 12px;
        border: 1px solid var(--line-2);
        color: var(--fg-2);
        font-size: 11px;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .button:hover {
        border-color: var(--fg);
        background: var(--fg);
        color: var(--bg);
      }

      .button--primary {
        border-color: var(--red);
        color: var(--red);
      }

      .button--primary:hover {
        border-color: var(--red);
        background: var(--red);
        color: var(--bg);
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--fg-4);
        font-size: 10px;
      }

      .footer a:hover {
        color: var(--fg);
      }

      @media (max-width: 480px) {
        .wrap {
          padding-top: 20px;
        }

        .main {
          padding-block: 36px;
        }

        .terminal__bar {
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="%BASE_URL%" aria-label="subway.exe home">
          <img src="%BASE_URL%logo.png" alt="" width="30" height="27" />
          <span>subway<span class="accent">.exe</span></span>
        </a>
        <span class="tag">404</span>
      </header>

      <main class="main">
        <section class="terminal" aria-labelledby="not-found-title">
          <div class="terminal__bar">
            <span>subway.exe — error</span>
            <span>exit 127</span>
          </div>
          <div class="terminal__body">
            <p class="prompt">
              <span class="prompt__host">guest@subway</span>
              <span class="prompt__dollar">$</span> cd this-page
            </p>
            <p class="error">bash: cd: this-page: No such file or directory</p>

            <h1 id="not-found-title">wrong turn<span class="accent">.</span></h1>
            <p class="copy">
              That path does not exist. The feed, the commands, and the install
              notes are all back at the root.
            </p>

            <div class="actions">
              <a class="button button--primary" href="%BASE_URL%">[ cd ~ ]</a>
              <a class="button" href="%BASE_URL%#commands">[ list commands ]</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span>© 2026 subway.exe</span>
        <a href="https://github.com/pittkajull/subway.exe">github ↗</a>
      </footer>
    </div>
  </body>
</html>
